name: Build and publish Docker images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./artgallery-frontend
          file: ./artgallery-frontend/Dockerfile
          push: true
          tags: |
            dattaprasad3/docker-frontend-31486:latest
            dattaprasad3/docker-frontend-31486:sha-${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ArtGallery
          file: ./ArtGallery/Dockerfile
          push: true
          tags: |
            dattaprasad3/docker-backend-31486:latest
            dattaprasad3/docker-backend-31486:sha-${{ github.sha }}
